name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem KEYSTORE_B64: o APK sai assinado com chave de debug temporária."
          fi

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk CalendarioDespertador.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CalendarioDespertador
          path: CalendarioDespertador.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Calendário Despertador 1.0.${{ github.run_number }}
          make_latest: true
          files: CalendarioDespertador.apk
          body: |
            Descarrega o ficheiro **CalendarioDespertador.apk** abaixo no telemóvel e instala-o.
