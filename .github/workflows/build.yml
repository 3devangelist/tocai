name: Compilar APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME); o Gradle instala o que faltar.

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem KEYSTORE_B64: o APK sai assinado com uma chave de debug temporária e as atualizações não se instalam por cima."
          fi

      - name: Testes e compilação
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease

      - name: Relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-testes
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk Tocai.apk

      - uses: actions/upload-artifact@v7
        with:
          name: Tocai
          path: Tocai.apk

      - name: Apagar chave de assinatura
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Preparar notas da versão
        if: github.ref == 'refs/heads/main'
        run: |
          {
            echo "## Tocaí 1.0.${{ github.run_number }}"
            echo
            echo "**Novidades:** $(git log -1 --pretty=%s)"
            echo
            echo "Para instalar: descarrega o **Tocai.apk** abaixo, em *Assets*, e abre-o. Se já tens o Tocaí, a app pede para atualizar sozinha."
          } > release-notes.md

      - name: Publicar versão
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tocaí 1.0.${{ github.run_number }}
          make_latest: true
          files: Tocai.apk
          body_path: release-notes.md
